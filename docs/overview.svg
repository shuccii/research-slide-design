<text x="60" y="510" font-size="34" font-weight="600" fill="#1A1A1A" text-anchor="start" xml:space="preserve">出力</text>
<text x="60" y="572" font-size="30" font-weight="300" fill="#1A1A1A" text-anchor="start" xml:space="preserve">・16:9 の PPTX(4:3 も可)</text>
<text x="60" y="626" font-size="30" font-weight="300" fill="#1A1A1A" text-anchor="start" xml:space="preserve">・ネイティブ数式+代替テキストに LaTeX</text>
<text x="60" y="680" font-size="30" font-weight="300" fill="#1A1A1A" text-anchor="start" xml:space="preserve">・SVG / PDF / PNG の図と生成スクリプト</text>
<text x="60" y="734" font-size="30" font-weight="300" fill="#1A1A1A" text-anchor="start" xml:space="preserve">・文献表と図表の出典表</text>
<text x="820" y="510" font-size="34" font-weight="600" fill="#1A1A1A" text-anchor="start" xml:space="preserve">守る規則</text>
<text x="820" y="572" font-size="30" font-weight="300" fill="#1A1A1A" text-anchor="start" xml:space="preserve">・1 スライド 1 イシュー、タイトルは結論</text>
<text x="820" y="626" font-size="30" font-weight="300" fill="#1A1A1A" text-anchor="start" xml:space="preserve">・余白は文字・図を大きくして埋める</text>
<text x="820" y="680" font-size="30" font-weight="300" fill="#0072B2" text-anchor="start" xml:space="preserve">・色は役割のある場所だけ(本研究 = 青)</text>
<text x="820" y="734" font-size="30" font-weight="300" fill="#1A1A1A" text-anchor="start" xml:space="preserve">・表は色なし・黒罫線</text>
<text x="820" y="788" font-size="30" font-weight="300" fill="#A04500" text-anchor="start" xml:space="preserve">・出典のない数値・図は載せない</text>
<text x="60" y="878" font-size="22" font-weight="300" fill="#595959" text-anchor="start" xml:space="preserve">模式図。各ファイルの役割は README のファイル構成を参照</text>
